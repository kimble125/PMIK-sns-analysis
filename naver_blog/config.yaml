# PM-International Korea 네이버 블로그 크롤러 설정 파일
# 버전: 10.2.0
# 최종 수정일: 2025-11-20

# ===========================
# 크롤러 메타 정보
# ===========================
metadata:
  version: "10.2.0"
  name: "PM-International Korea 네이버 블로그 크롤러"
  author: "PMI Korea 데이터 분석팀"
  last_updated: "2025-11-20"

# ===========================
# 테스트 모드 설정
# ===========================
test_mode:
  enabled: true  # v10.3.1 테스트 모드 활성화
  max_duration_minutes: 40  # v10.3.1: 40분 테스트 (작업 중인 게시물까지만 완료 후 종료)
  max_posts: null  # 무제한 (시간으로만 제한)

# ===========================
# 크롤링 목표 설정
# ===========================
targets:
  total_target: 15000  # 전체 목표 (테스트 모드에서는 무시)
  max_search_results: 100  # v10.3: 키워드당 최대 검색 결과 (100개로 제한)

# ===========================
# 체크포인트 설정
# ===========================
checkpoint:
  enabled: true
  interval_seconds: 3600  # 1시간마다 저장
  save_directory: "checkpoints"

# ===========================
# 에러 복구 설정
# ===========================
error_recovery:
  max_retries: 3
  retry_delays: [5, 10, 30]  # 초 단위
  max_consecutive_errors: 50
  failed_urls_file: "failed_urls.json"

# ===========================
# 크롤링 속도 설정
# ===========================
crawling:
  page_load_timeout: 10  # 초
  request_delay_min: 1.5  # 초
  request_delay_max: 2.5  # 초
  adaptive_delay:
    initial_min: 2.0
    initial_max: 4.0

# ===========================
# 검색 키워드 설정
# ===========================
keywords:
  primary:
    - keyword: "피엠인터내셔널"
      target: 1000
    - keyword: "독일피엠"
      target: 1000
    - keyword: "PM인터내셔널"
      target: 1000
    - keyword: "피엠코리아"
      target: 1000
  
  secondary:
    - keyword: "피트라인"
      target: 1000
    - keyword: "탑쉐이프"
      target: 1000
    - keyword: "프로쉐이프"
      target: 1000
    - keyword: "디드링크"
      target: 1000
    - keyword: "뮤노겐"
      target: 1000
    - keyword: "엑티바이즈"
      target: 1000
    - keyword: "파워칵테일"
      target: 1000
  
  # v10.2: 제품 키워드 테스트
  product_test:
    - keyword: "레스토레이트"
      target: 1000

# ===========================
# 필터링 키워드
# ===========================
filters:
  pm_brand_keywords:
    # v10.1: 너무 광범위한 "피엠", "PM" 제거
    - "피엠인터내셔널"
    - "PM International"
    - "PMInternational"
    - "PMIK"
    - "독일PM"
    - "독일피엠"
    - "FitLine"
    - "핏라인"
    - "피트라인"
    - "PM인터내셔널"
    - "피엠코리아"
  
  pm_sales_keywords:
    - "추천인"
    - "추천인코드"
    - "추천인 코드"
    - "추천인번호"
    - "추천인 번호"
    - "파트너"
    - "파트너코드"
    - "파트너 코드"
    - "파트너번호"
    - "파트너 번호"
    - "등록"
    - "가입"
    - "문의"
  
  exclude_keywords:
    # 언론/뉴스
    - "뉴스"
    - "기사"
    - "보도"
    - "공지"
    - "아카데미"
    - "세미나"
    - "기자"
    - "취재"
    # 피엠코리아 매트리스 업체
    # v10.4: 복합 키워드는 + 기호로 연결 (AND 로직, 모두 포함 시 배제)
    - "피엠코리아+침대"      # "피엠코리아"와 "침대"가 모두 있을 때만 배제
    - "피엠코리아+매트리스"  # "피엠코리아"와 "매트리스"가 모두 있을 때만 배제
    - "혼수가구"
    - "신혼가구"
    - "팽창탱크"
    - "배관"
    - "이력서"
    - "salary"
    - "job"
    - "recruit"
    - "근무환경"
    - "사원"
    - "직원"
    # 기타 노이즈
    - "주가"
    - "주식"
    - "상장"
    - "IR"
    - "공시"
  
  excluded_blog_ids:
    # 마케팅/뉴스 블로그
    - "ysc14"
    - "marketingtoday"
    - "biznstory"
    - "kimnkimmarketing"  # v10.1: 추가
    - "dlxortjs"  # v10.4: 추가
    # 피엠코리아 매트리스 업체
    - "embarkonsleep"
    - "pmkorea_bed"
    # 채용공고/HR 블로그
    - "jjobs"
    - "saraminhr"
    - "incruit"
    - "jobkorea"
    - "wanted"
    - "rocketpunch"
    - "saramin"
    - "peoplenjob"
    # 기업정보/주식 블로그
    - "plus_company"
    - "comp_info"
    - "stock_info"
    - "invest_guru"
  
  media_title_patterns:
    - '"[^"]+",\s*"'  # "OOO 회장", "..." 같은 인용문
    - '기자\s+'
    - '취재\s+'
  
  # v10.1: 제품명 키워드 (띄어쓰기 무시 매칭)
  product_keywords:
    # 주요 라인
    - "FitLine"
    - "피트라인"
    - "핏라인"
    - "BeautyLine"
    - "뷰티라인"
    - "FitLine Skin"
    - "피트라인 스킨"
    - "핏라인 스킨"
    # 핵심 제품
    - "파워칵테일"
    - "Power Cocktail"
    - "액티바이즈"
    - "Activize"
    - "리스토레이트"
    - "Restorate"
    - "탑쉐이프"
    - "탑셰이프"
    - "TopShape"
    - "디드링크"
    - "D-Drink"
    - "얼티메이트영"
    - "Ultimate Young"
    # 건강 보조
    - "뮤노겐"
    - "Munogen"
    - "제너레이션 50+"
    - "Generation 50+"
    - "오메가 3+E"
    - "Omega 3+E"
    - "Q10플러스"
    - "Q10 Plus"
    - "큐텐플러스"
    - "씨밸런스"
    - "C Balance"
    - "베이직스"
    - "Basics"
    - "베이젠플러스"
    - "Basen Plus"
    - "주니어파워칵테일"
    - "Junior Power Cocktail"
    # 다이어트/체형
    - "프로쉐이프"
    - "프로셰이프"
    - "ProShape"
    - "프로쉐이프 아미노"
    - "프로셰이프 아미노"
    - "ProShape Amino"
    - "겔링핏"
    - "Gel-ing Fit"
    - "겔링핏젤"
    - "Gel-ing Fit Gel"
    # 뷰티
    - "뷰티콜라겐"
    - "Beauty Collagen"
    - "클렌징폼"
    - "Cleansing Foam"
    - "필링마스크"
    - "Peeling Mask"
    - "밸런싱크림"
    - "Balancing Cream"
    - "액티바이즈세럼"
    - "Activize Serum"
