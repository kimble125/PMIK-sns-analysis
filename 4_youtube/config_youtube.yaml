# =============================================================================
# YouTube 크롤러 v5 설정
# =============================================================================

version: v5

# -----------------------------------------------------------------------------
# 실행 모드 설정
# -----------------------------------------------------------------------------
execution_mode:
  test_mode: false
  max_duration_minutes: 0          # 0 = 무제한 (모든 데이터 수집까지)
  checkpoint_interval_minutes: 10
  first_save_minutes: 10           # 10분 후 첫 저장

# -----------------------------------------------------------------------------
# YouTube API 설정
# -----------------------------------------------------------------------------
api:
  daily_quota_limit: 10000
  max_results_per_search: 50       # 페이지당 최대 결과 (YouTube 최대값)
  max_pages_per_keyword: 7         # 키워드당 최대 7페이지 (350개)
  region_code: KR
  relevance_language: ko

# -----------------------------------------------------------------------------
# 검색 키워드 v5
# -----------------------------------------------------------------------------
keywords:
  # 메인 키워드 (브랜드/회사)
  primary:
    - "피엠인터내셔널"
    - "독일피엠"
    - "PM인터내셔널"
    - "PM International"
    - "피엠코리아"
    - "PM Korea"
    
  # 제품/서비스 키워드
  secondary:
    - "피트라인"
    - "액티바이즈"
    - "리스토레이트"
    - "셀액티브"
    - "이뮨플러스"
    - "마인드마스터"
    - "오토십"
    - "피엠 사업"
    - "피엠 후기"

# -----------------------------------------------------------------------------
# 출력 설정
# -----------------------------------------------------------------------------
output:
  data_dir: output
  videos_filename: youtube_pm_videos
  channels_filename: youtube_pm_channels

# -----------------------------------------------------------------------------
# 체크포인트 설정
# -----------------------------------------------------------------------------
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints
  checkpoint_file: youtube_checkpoint.json

# -----------------------------------------------------------------------------
# 로깅 설정
# -----------------------------------------------------------------------------
logging:
  level: INFO
  log_dir: logs
